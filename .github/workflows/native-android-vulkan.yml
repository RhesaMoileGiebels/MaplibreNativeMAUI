name: Native Android Vulkan

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Android Vulkan ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLN_WITH_VULKAN=ON

      - name: Build mln-cabi
        timeout-minutes: 60
        run: cmake --build build --target mln-cabi --parallel 4

      # The release build ships with full debug info (~107 MB per ABI vs ~8 MB
      # for official MapLibre Android). Strip to what the dynamic linker needs;
      # keep the unstripped copy as a separate artifact for crash symbolication.
      - name: Strip libmln-cabi.so
        run: |
          STRIP="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          SO=$(find build -name libmln-cabi.so)
          cp "$SO" "$SO.debug"
          "$STRIP" --strip-unneeded "$SO"
          echo "libmln-cabi.so: $(du -h "$SO.debug" | cut -f1) unstripped -> $(du -h "$SO" | cut -f1) stripped"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-mln-android-${{ matrix.abi }}
          path: build/**/libmln-cabi.so
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: native-mln-android-${{ matrix.abi }}-debugsyms
          path: build/**/libmln-cabi.so.debug
          retention-days: 7
