name: Rhike Release (Android only)

# Fork-only release pipeline: builds the Android OpenGL natives (stripped, see
# native-android.yml) and packs MapLibreNative.Maui + .Handlers with Android
# natives only. Publishes a GitHub release on the fork; never pushes to
# NuGet.org. Windows/Apple/Vulkan/WPF are deliberately out of scope — consumers
# of this fork build Android apps.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version:   ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}

    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check GitHub releases
        id: check
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "published=true"  >> "$GITHUB_OUTPUT"
            echo "Already released — skipping build."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Not yet released — proceeding."
          fi

  build-android:
    name: Build Android OpenGL native
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/native-android.yml

  pack:
    name: Pack NuGet (Android natives only)
    runs-on: macos-latest
    needs: [version-check, build-android]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 9 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Android native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          path: native-artifacts

      - name: Arrange native libs for bindings project
        run: |
          N=bindings/native
          mkdir -p $N/android-arm64 $N/android-x64

          find native-artifacts/native-android-arm64-v8a -name "libmln-cabi.so" -exec cp {} $N/android-arm64/ \;
          find native-artifacts/native-android-x86_64 -name "libmln-cabi.so" -exec cp {} $N/android-x64/ \;

          echo "Native libs arranged:"
          find $N -type f -exec ls -lh {} \;

      - name: Restore workloads
        run: dotnet workload restore maplibre-maui.sln

      - name: Pack MapLibreNative.Maui
        run: |
          dotnet pack bindings/MapLibreNative.Maui.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -p:_MbglNativeDir=$(pwd)/bindings/native/ \
            -o artifacts/

      - name: Pack MapLibreNative.Maui.Handlers
        run: |
          dotnet pack handlers/MapLibreNative.Maui.Handlers.csproj \
            -c Release \
            -p:Version=${{ needs.version-check.outputs.version }} \
            -o artifacts/

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version-check, build-android, pack]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/

      - name: Download Android debug symbols
        uses: actions/download-artifact@v4
        with:
          pattern: native-android-*-debugsyms
          path: debugsyms/

      - name: Zip debug symbols
        run: |
          for d in debugsyms/native-android-*-debugsyms; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            (cd "$d" && zip -r "../../artifacts/${name}.zip" .)
          done
          ls -lh artifacts/

      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" \
              'BEGIN{p=0} $0==ver{p=1;next} /^## /&&p{exit} p{print}' \
              CHANGELOG.md > release-notes.md
          else
            echo "Release v${VERSION}." > release-notes.md
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag:          v${{ needs.version-check.outputs.version }}
          name:         v${{ needs.version-check.outputs.version }}
          bodyFile:     release-notes.md
          artifacts:    "artifacts/*.nupkg,artifacts/*.zip"
          draft:        false
          allowUpdates: true
          commit:       ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
